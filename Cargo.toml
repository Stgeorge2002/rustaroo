[package]
name = "rustroo"
version = "0.1.0"
edition = "2021"
description = "Gene-level bacterial pangenome: one intact reference sequence per gene, and which samples carry that gene"
license = "MIT"
repository = "https://github.com/Stgeorge2002/rustaroo"
homepage = "https://github.com/Stgeorge2002/rustaroo"
readme = "README.md"

[[bin]]
name = "rustroo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rayon = "1.10"
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

[features]
prof = ["pprof"]
counters = []
hashseed = []

[profile.profiling]
inherits = "release"
debug = "line-tables-only"
