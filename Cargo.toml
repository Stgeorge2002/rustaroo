[package]
name = "rustroo"
version = "0.1.0"
edition = "2021"
description = "Gene-level bacterial pangenome: one intact reference sequence per gene, and which samples carry that gene"
license = "MIT"

[[bin]]
name = "rustroo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rayon = "1.10"
