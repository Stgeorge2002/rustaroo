[package]
name = "mutcode"
version = "0.1.0"
edition = "2021"
description = "Lossless gene-reference consensus encoding from final Snippy VCFs"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
